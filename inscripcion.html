<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <!-- FAVICON Y/O LOGOTIPO DE LA PÁGINA -->
     <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

    <!-- LIBRERIA DE FUENTES -->
     <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

     <!-- FRAMEWORD DE BOOTSTRAP -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

      <!-- LIBRERIA DE ICONOS -->
       <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>

       <link rel="stylesheet" href="css/style.css">

</head>
<body>
            <h1 class ="T">Formulario de Inscripción de curso</h1>
            <h2 class="St">Rellene cuidadosamente el formulario de inscripción</h2>

            <div class="formulario-layout">
                <form class="formulario" action="php/enviar.php" method="POST">
                    <div class="row g-3 mb-3">
                        <h3 class="col-12">Nombre del alumno</h3>
                        <div class="col-12 col-md-4">
                            <label for="nombre">Nombre</label>
                            <input class="form-control" type="text" id="nombre" name="nombre">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="segundo_nombre">Segundo nombre</label>
                            <input class="form-control" type="text" id="segundo_nombre" name="segundo_nombre">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="apellido">Apellido</label>
                            <input class="form-control" type="text" id="apellido" name="apellido">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label class="h3" for="fecha_nacimiento">Fecha de nacimiento</label>
                            <input class="form-control" type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="h3" for="genero">Género</label>
                            <select class="form-select" id="genero" name="genero">
                                <option value="" selected disabled hidden>Seleccione una opción</option>
                                <option value="hombre">Hombre</option>
                                <option value="mujer">Mujer</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <h3 class="col-12">Dirección</h3>
                        <div class="col-12">
                            <label for="direccion">Dirección de la calle</label>
                            <input class="form-control" type="text" id="direccion" name="direccion">
                        </div>
                        <div class="col-12">
                            <label for="direccion_linea_2">Dirección de la calle, línea 2</label>
                            <input class="form-control" type="text" id="direccion_linea_2" name="direccion_linea_2">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="ciudad">Ciudad</label>
                            <input class="form-control" type="text" id="ciudad" name="ciudad">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="estado">Estado / Provincia</label>
                            <input class="form-control" type="text" id="estado" name="estado">
                        </div>
                        <div class="col-12">
                            <label for="codigo_postal">Código postal</label>
                            <input class="form-control" type="text" id="codigo_postal" name="codigo_postal">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label class="h3" for="email">Email</label>
                            <input class="form-control" type="email" id="email" name="email">
                            <small>ejemplo@ejemplo.com</small>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="h3" for="telefono">Número de teléfono</label>
                            <input class="form-control" type="tel" id="telefono" name="telefono">
                            <small>Por favor ingrese un número de teléfono válido</small>
                        </div>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="h3">¿Ha recibido otros cursos anteriormente?</legend>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="cursos_si" name="recibio_cursos" value="si">
                                    <label class="form-check-label" for="cursos_si">Sí</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="cursos_no" name="recibio_cursos" value="no">
                                    <label class="form-check-label" for="cursos_no">No</label>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <label class="h3" for="empresa">Empresa</label>
                            <input class="form-control" type="text" id="empresa" name="empresa">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="h3" for="curso">Curso</label>
                            <select class="form-select" id="curso" name="curso">
                                <option value="" selected disabled hidden>Seleccione</option>
                                <option value="javascript">JavaScript</option>
                                <option value="css">CSS</option>
                                <option value="php">PHP</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="h3" for="comentarios">Comentarios adicionales</label>
                        <textarea class="form-control" id="comentarios" name="comentarios" rows="3"></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary boton-envio">
                            <span class="boton-envio__texto">Enviar</span>
                            <svg class="boton-envio__check" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m5 12 4 4L19 6"></path>
                            </svg>
                        </button>
                        <p class="estado-envio" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </div>
    
    <script src="js/app.js" defer></script>
</body>
</html>
